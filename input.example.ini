; MH3U PC input settings. Copy to input.ini (next to this file) and edit; input.ini is not tracked by git.
; Everything is mapped onto the Wii U GamePad. Unlisted keys keep their defaults (shown below).

[gamepad]
; xbox:     buttons by Xbox label - Xbox A / PlayStation Cross = Wii U A (confirm), B / Circle = B,
;           X / Square = X, Y / Triangle = Y
; nintendo: buttons by position, as on the GamePad - bottom = B, right = A, left = Y, top = X
layout = xbox
deadzone = 0.15

[mouse]
; Click in the window to capture the mouse; Esc releases it. Mouse movement drives the right stick (camera).
; sensitivity = stick deflection per pixel moved between two game frames (0.05: 20 px/frame = full speed)
sensitivity = 0.05
invert_y = 0
; game frames a mouse-wheel notch holds its button
wheel_frames = 3

[bindings]
; <SDL key name | mouse_left mouse_right mouse_middle mouse_x1 mouse_x2 | wheel_up wheel_down> = <target | none>
; targets: A B X Y L R ZL ZR PLUS MINUS UP DOWN LEFT RIGHT LSTICK RSTICK TV
;          lstick_up/down/left/right, rstick_up/down/left/right
; Action names are the Wii U defaults as far as known - check them in game (Options -> controls).
W = lstick_up
S = lstick_down
A = lstick_left
D = lstick_right
I = rstick_up
K = rstick_down
J = rstick_left
L = rstick_right
Up = UP
Down = DOWN
Left = LEFT
Right = RIGHT
Return = A
Backspace = B
Space = B
F = A
E = Y
Left Shift = R
Q = L
Z = ZL
C = ZR
Tab = PLUS
M = MINUS
V = LSTICK
mouse_left = X
mouse_right = A
mouse_middle = RSTICK
mouse_x1 = ZL
mouse_x2 = ZR
wheel_up = LEFT
wheel_down = RIGHT
