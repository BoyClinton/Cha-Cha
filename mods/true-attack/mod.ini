name = True Attack
author = Cha-Cha
version = 1.0
description = Shows weapons' true attack in every menu (Smithy, item box, equipment, Guild Card) instead of the bloated number, which is the true value times a multiplier per weapon class. Damage is not changed. Optional: off until switched on.
