# Cha-Cha mod description (MODS -> Mods)
name = Charm Table Fix
author = Cha-Cha
version = 1.0
description = Any talisman can come from any save: each talisman is rolled as if from a random one of the 17 charm tables, with the game's own odds, so cursed tables no longer lock talismans out. Your save keeps its own table, and talismans you already have don't change. Optional: off until switched on.
default = off
